    <!--menu superior-->
    <script>
        function NVMdoCopy(){
            var contato = document.getElementById('contato');
            var botao = document.getElementById('list');

            if (!contato) {
                return;
            }

            if (bringContato == false) {
                contato.classList.add('aberto');
                bringContato = true;
                if (botao) botao.setAttribute('aria-expanded', 'true');
            } else {
                contato.classList.remove('aberto');
                bringContato = false;
                if (botao) botao.setAttribute('aria-expanded', 'false');
            }
        }
    </script>
    <div class="shadow p-1 text-center topMenu">
        <button id="list" onmousedown="NVMdoCopy()" class="contactFab" aria-label="Contato" aria-expanded="false" title="Contato">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">

                <path d="M8 8.5h8M8 12h5"/>

            <span class="traduzir">Contato</span>
